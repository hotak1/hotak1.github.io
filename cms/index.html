<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Content Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F4;
    --ink: #1C1A17;
    --umber: #5C4A3A;
    --brass: #8B6F47;
    --parchment: #E8E2D6;
    --forest: #2E4034;
    --rule: #D8D0C0;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--brass); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--forest); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { 
    outline: 2px solid var(--forest); outline-offset: 2px; 
  }

  .layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    max-width: 1040px;
    margin: 0 auto;
    min-height: 100vh;
  }

  nav.side {
    border-right: 1px solid var(--rule);
    padding: 64px 28px 40px 0;
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
  }

  .nav-name {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink);
    margin: 0 0 6px;
    font-weight: 500;
  }

  .nav-role {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--umber);
    margin: 0 0 36px;
  }

  nav.side ul { list-style: none; margin: 0; padding: 0; }
  nav.side li { margin-bottom: 14px; }

  nav.side a {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--umber);
    text-decoration: none;
    border-left: 2px solid transparent;
    padding-left: 10px;
    display: inline-block;
  }

  nav.side a.active, nav.side a:hover { color: var(--forest); border-left-color: var(--forest); }

  main { padding: 64px 40px 100px 44px; max-width: 760px; }

  h1 {
    font-size: clamp(2.1rem, 4vw, 2.7rem);
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 18px;
  }

  .subtitle {
    font-size: 1.15rem;
    color: var(--umber);
    max-width: 48ch;
    margin: 0 0 36px;
  }

  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 40px 0 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  .form-group { margin-bottom: 24px; }

  label {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--umber);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  input[type="text"].content-input, textarea {
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 12px;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
  }

  input[type="password"], input.mono-input, select {
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
  }

  select:focus, input:focus, textarea:focus {
    background: #ffffff;
    border-color: var(--brass);
  }

  textarea { resize: vertical; min-height: 110px; }

  .btn {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    padding: 10px 20px;
    border: 1px solid var(--forest);
    background: var(--forest);
    color: var(--paper);
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .btn:hover { background: var(--ink); border-color: var(--ink); }

  .btn-secondary {
    background: transparent;
    color: var(--umber);
    border-color: var(--rule);
  }

  .btn-secondary:hover { background: var(--parchment); color: var(--ink); border-color: var(--brass); }

  .status-msg {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--forest);
    background: #f2f6f3;
    border: 1px solid #c2d6c7;
    padding: 10px 14px;
    margin-bottom: 24px;
    display: none;
  }

  footer {
    padding: 28px 40px 40px 44px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--umber);
    grid-column: 2;
    border-top: 1px solid var(--rule);
    margin-top: 40px;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav.side {
      position: relative;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding: 32px 24px 24px;
    }
    nav.side ul { display: flex; flex-wrap: wrap; gap: 4px 18px; }
    nav.side li { margin-bottom: 0; }
    main { padding: 40px 24px 80px; }
    footer { grid-column: 1; padding: 24px; }
  }
</style>
</head>
<body>

<div class="layout">
  <nav class="side" aria-label="CMS navigation">
    <p class="nav-name" id="sidebar-name">Alex Rivera</p>
    <p class="nav-role">CMS Workspace</p>
    <ul>
      <li><a href="../index.html">← Main Site</a></li>
      <li><a href="#" class="active">Content Editor</a></li>
    </ul>
  </nav>

  <main>
    <section id="cms-section">
      <h1>Website Content Editor</h1>
      <p class="subtitle">Select a section to modify its headings, paragraphs, and entries.</p>

      <div id="save-status" class="status-msg">Changes saved successfully and live website updated!</div>

      <div class="form-group">
        <label for="target-section">Target Section</label>
        <select id="target-section">
          <option value="all">All Sections (Full Page)</option>
          <option value="hero">Hero & Introduction</option>
          <option value="about">About</option>
          <option value="work">Work Timeline</option>
          <option value="projects">Projects Listing</option>
          <option value="contact">Contact Information</option>
          <option value="footer">Footer Copy</option>
        </select>
      </div>

      <form id="cms-form">
        <h2>Edit Section Fields</h2>
        <div id="editor-fields"></div>

        <div style="display: flex; gap: 12px; margin-top: 36px;">
          <button type="submit" class="btn">Save Content</button>
          <button type="button" id="reset-btn" class="btn btn-secondary">Reset to Default</button>
        </div>
      </form>
    </section>
  </main>

  <footer>CMS Workspace · Alex Rivera</footer>
</div>

<script>
  let siteContent = {};

  const sectionLabels = {
    hero: "Hero & Introduction",
    about: "About",
    work: "Work Timeline",
    projects: "Projects Listing",
    contact: "Contact Information",
    footer: "Footer Copy"
  };

  const targetSelect = document.getElementById('target-section');
  const editorFields = document.getElementById('editor-fields');
  const cmsForm = document.getElementById('cms-form');
  const saveStatus = document.getElementById('save-status');
  const resetBtn = document.getElementById('reset-btn');

  async function init() {
    // 1. Try reading localStorage
    const saved = localStorage.getItem('siteContent');
    if (saved) {
      try { siteContent = JSON.parse(saved); } catch(e){}
    }

    // 2. Fallback to content.json if empty
    if (!siteContent || Object.keys(siteContent).length === 0) {
      try {
        const res = await fetch('../content.json?t=' + Date.now());
        if (res.ok) {
          siteContent = await res.json();
        }
      } catch (e) {
        console.error('Failed to load initial json', e);
      }
    }

    renderFields();
  }

  function renderFields() {
    const selected = targetSelect.value;
    let html = '';

    for (const [secKey, fields] of Object.entries(siteContent)) {
      if (selected !== 'all' && selected !== secKey) continue;

      if (selected === 'all') {
        html += `<h2 style="margin-top: 32px;">${sectionLabels[secKey] || secKey.toUpperCase()}</h2>`;
      }

      for (const [key, val] of Object.entries(fields)) {
        const fieldId = `${secKey}__${key}`;
        const label = key.replace(/([A-Z0-9])/g, ' $1').toUpperCase();
        const isLong = String(val).length > 50;

        html += `
          <div class="form-group">
            <label for="${fieldId}">${label}</label>
            ${isLong ? 
              `<textarea id="${fieldId}" name="${fieldId}">${val}</textarea>` : 
              `<input type="text" id="${fieldId}" name="${fieldId}" value="${val}" class="content-input">`
            }
          </div>
        `;
      }
    }

    editorFields.innerHTML = html;
  }

  targetSelect.addEventListener('change', renderFields);

  cmsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(cmsForm);

    // Read current form entries into siteContent dictionary
    for (const [fieldId, val] of formData.entries()) {
      const [secKey, key] = fieldId.split('__');
      if (siteContent[secKey] && siteContent[secKey][key] !== undefined) {
        siteContent[secKey][key] = val;
      }
    }

    // Save directly to localStorage for immediate availability on index.html
    localStorage.setItem('siteContent', JSON.stringify(siteContent));

    // Attempt saving to PHP server if save.php exists
    try {
      await fetch('save.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(siteContent)
      });
    } catch(err) {
      // Local execution fallback
    }

    saveStatus.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  resetBtn.addEventListener('click', () => {
    if (confirm("Reset all content back to defaults?")) {
      localStorage.removeItem('siteContent');
      location.reload();
    }
  });

  init();
</script>

</body>
</html>
