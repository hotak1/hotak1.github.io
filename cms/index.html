<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Dashboard | hotak1.com</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Robust inline overrides to guarantee clean professional styling */
    body {
      background-color: #0f172a;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .login-card h1 {
      font-size: 1.75rem;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .login-card p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .login-card .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .login-card label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0f172a;
      font-size: 0.9rem;
    }

    .login-card input[type="text"],
    .login-card input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      background: #f8fafc;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .login-card input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    .login-card button {
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .login-card button:hover {
      background: #1d4ed8;
    }

    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    #cms-app {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Login Gate Overlay -->
  <div id="login-overlay">
    <div class="login-card">
      <h1>CMS Login</h1>
      <p>Enter your credentials to manage hotak1.com content.</p>
      <div id="login-error" class="error-msg">Invalid username or password. Please try again.</div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Protected CMS Application -->
  <div id="cms-app">
    <header>
      <a href="../index.html" class="logo">hotak1.com</a>
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav id="nav-menu">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="index.html" class="active">CMS Dashboard</a>
      </nav>
    </header>

    <main>
      <div class="card">
        <h1>Website Content CMS</h1>
        <p>Select a page to edit its headings, taglines, and paragraph copy dynamically.</p>
        
        <!-- Page Selector Form -->
        <div class="form-group">
          <label for="page-selector">Choose Page to Edit</label>
          <select id="page-selector" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 1rem;">
            <option value="index">Home Page (index.html)</option>
            <option value="about">About Page (about.html)</option>
            <option value="contact">Contact Page (contact.html)</option>
          </select>
        </div>

        <!-- Dynamic Content Editor Form -->
        <form id="cms-form">
          <div id="editor-fields">
            <!-- Dynamic inputs will load here via JavaScript -->
          </div>

          <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Content Changes</button>
            <button type="button" id="logout-btn" class="btn btn-secondary">Sign Out</button>
          </div>
        </form>
      </div>
    </main>

    <footer>&copy; 2026 hotak1.com. All rights reserved.</footer>
  </div>

  <script src="../script.js"></script>
  <script>
    const AUTH_USER = "pat";
    const AUTH_PASS = "Today123";

    const loginOverlay = document.getElementById('login-overlay');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const cmsApp = document.getElementById('cms-app');
    const logoutBtn = document.getElementById('logout-btn');

    if (sessionStorage.getItem('cms_authenticated') === 'true') {
      showCMS();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === AUTH_USER && pass === AUTH_PASS) {
        sessionStorage.setItem('cms_authenticated', 'true');
        loginError.style.display = 'none';
        showCMS();
      } else {
        loginError.style.display = 'block';
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('cms_authenticated');
      cmsApp.style.display = 'none';
      loginOverlay.style.display = 'flex';
      loginForm.reset();
    });

    function showCMS() {
      loginOverlay.style.display = 'none';
      cmsApp.style.display = 'block';
    }

    const pageData = {
      index: {
        title: "Welcome to Our Platform",
        subtitle: "We deliver high-performance solutions designed to scale your operational workflow efficiently. Explore our background or contact our team directly.",
        feature1Title: "Reliable Infrastructure",
        feature1Desc: "Built on solid core engineering practices to ensure high uptime and security.",
        feature2Title: "Seamless Integration",
        feature2Desc: "Easily integrate with existing cloud and enterprise software setups.",
        feature3Title: "Automated Workflows",
        feature3Desc: "Save operational hours by deploying fully automated deployment pipelines."
      },
      about: {
        title: "About Our Organization",
        paragraph1: "Founded with a focus on reliability and core engineering excellence, we help enterprise partners structure, deploy, and automate critical digital infrastructure.",
        paragraph2: "Our multidisciplinary team bridges the gap between legacy reliability and modern automation practices, enabling scalable operations without compromising security."
      },
      contact: {
        title: "Contact Us",
        subtitle: "Fill out the form below and our team will get back to you within 24 hours."
      }
    };

    const pageSelector = document.getElementById('page-selector');
    const editorFields = document.getElementById('editor-fields');
    const cmsForm = document.getElementById('cms-form');

    function loadEditorFields(pageKey) {
      const data = pageData[pageKey];
      let html = '';
      
      for (const [key, value] of Object.entries(data)) {
        const formattedLabel = key.replace(/([A-Z])/g, ' $1').toUpperCase();
        html += `
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="${key}">${formattedLabel}</label>
            ${value.length > 80 ? 
              `<textarea id="${key}" name="${key}" required>${value}</textarea>` : 
              `<input type="text" id="${key}" name="${key}" value="${value}" required>`
            }
          </div>
        `;
      }
      editorFields.innerHTML = html;
    }

    loadEditorFields(pageSelector.value);

    pageSelector.addEventListener('change', (e) => {
      loadEditorFields(e.target.value);
    });

    cmsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const currentPage = pageSelector.value;
      const formData = new FormData(cmsForm);
      
      for (const [key, value] of formData.entries()) {
        pageData[currentPage][key] = value;
      }

      alert(`Successfully saved updates for ${currentPage}.html on hotak1.com!`);
    });
  </script>
</body>
</html>
