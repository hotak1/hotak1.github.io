<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lens & Aperture — Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="logo">LENS & VISION</div>
    <nav>
      <a href="#hero">Featured</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <!-- Hero Section: Left-to-Right Continuous Auto-Moving Marquee -->
  <section id="hero" class="hero-section">
    <div class="marquee-container">
      <div class="marquee-track">
        <!-- FIRST SET OF PHOTOS -->
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200" alt="Landscape 1"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1200" alt="Landscape 2"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1200" alt="Landscape 3"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?q=80&w=1200" alt="Landscape 4"></div>
        
        <!-- DUPLICATE SET (Required for seamless continuous infinite loop) -->
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200" alt="Landscape 1"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1200" alt="Landscape 2"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1200" alt="Landscape 3"></div>
        <div class="photo-card"><img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?q=80&w=1200" alt="Landscape 4"></div>
      </div>
    </div>
  </section>

  <!-- Portfolio Gallery Grid -->
  <section id="gallery" class="gallery-section">
    <h2>Selected Works</h2>
    <div class="gallery-grid">
      <!-- To replace images, change the src path to images/your-photo.jpg -->
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600" alt="Photo 1"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1600" alt="Photo 2"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1600" alt="Photo 3"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?q=80&w=1600" alt="Photo 4"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1600" alt="Photo 5"></div>
      <div class="gallery-item"><img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1600" alt="Photo 6"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Photography Portfolio. All rights reserved.</p>
  </footer>

  <!-- Lightbox Popup Modal for Viewing Full HD Photos -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Full view">
  </div>

  <script src="script.js"></script>
</body>
</html>
