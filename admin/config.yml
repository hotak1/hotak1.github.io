backend:
  name: github
  repo: hotak1/hotak1.github.io
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "financial_page"
    label: "Financial Services"
    files:
      - file: "business/financial-services.html"
        label: "Edit Financial Services"
        name: "financial_services"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Content"
            name: "body"
            widget: "markdown"
