<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Lee Ho Tak</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">LEE HO TAK <span>// VISUALS</span></a>
      <nav class="main-nav">
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="gear.html">GEAR & POST</a>
        <a href="contact.html" class="active">CONTACT</a>
      </nav>
    </div>
  </header>

  <main class="page-container form-container">
    <h2>COMMISSION AN ASSIGNMENT</h2>
    <p>Available for commercial bookings, dynamic vehicle shoots, and location scouting.</p>

    <form class="contact-form" action="#" method="POST">
      <div class="form-row">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
      </div>
      <input type="text" placeholder="Project Type (e.g., Automotive, Architectural)" required>
      <textarea rows="6" placeholder="Project Details & Timeline" required></textarea>
      <button type="submit" class="btn-primary">SEND INQUIRY</button>
    </form>
  </main>
</body>
</html>
